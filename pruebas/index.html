<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin - Lucy Tejada</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    h1 { text-align: center; }
    .card { background: white; padding: 20px; margin: 20px auto; width: 90%; max-width: 700px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { margin-top: 15px; padding: 10px; width: 100%; background: #007bff; border: none; color: white; cursor: pointer; border-radius: 5px; }
    button.secondary { background: #6c757d; }
    button:hover { opacity: 0.95; }
    .result { margin-top: 15px; padding: 10px; background: #eee; border-radius: 5px; font-size: 14px; white-space: pre-wrap; max-height: 320px; overflow: auto; }
    .row { display:flex; gap:10px; }
    .col { flex:1; }
    label { font-weight: bold; margin-top: 8px; display:block; }
  </style>
</head>
<body>

  <h1>Panel Administrador</h1>

  <!-- LOGIN -->
  <div class="card">
    <h2>Iniciar Sesión</h2>
    <input id="loginEmail" type="email" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Contraseña" />
    <div class="row">
      <button onclick="login()">Ingresar</button>
      <button class="secondary" onclick="logout()">Cerrar sesión</button>
    </div>
    <div id="loginResult" class="result"></div>
  </div>

  <!-- REGISTRO -->
  <div class="card">
    <h2>Registrar Usuario</h2>
    <input id="regFirst" placeholder="Nombre" />
    <input id="regLast" placeholder="Apellido" />
    <input id="regEmail" placeholder="Email" />
    <input id="regPass" type="password" placeholder="Contraseña" />
    <button onclick="registerUser()">Registrar</button>
    <div id="registerResult" class="result"></div>
  </div>

  <!-- UPDATE USER -->
  <div class="card">
    <h2>Actualizar Usuario</h2>
    <input id="updUserId" placeholder="ID del usuario" />
    <input id="updUserFirst" placeholder="Nuevo Nombre" />
    <input id="updUserLast" placeholder="Nuevo Apellido" />
    <button onclick="updateUser()">Actualizar</button>
    <div id="updateUserResult" class="result"></div>
  </div>

  <!-- CREAR PROGRAMA -->
  <div class="card">
    <h2>Crear Programa</h2>
    <input id="programName" placeholder="Nombre del programa" />
    <textarea id="programDesc" placeholder="Descripción"></textarea>
    <input id="programCapacity" type="number" placeholder="Capacidad" />
    <div class="row">
      <button onclick="createProgram()">Crear Programa</button>
      <button class="secondary" onclick="listPrograms()">Actualizar lista</button>
    </div>
    <div id="createProgramResult" class="result"></div>
  </div>

  <!-- LISTAR PROGRAMAS -->
  <div class="card">
    <h2>Listar Programas</h2>
    <div style="display:flex;gap:10px;align-items:center; margin-bottom:8px;">
      <button onclick="listPrograms()">Cargar Programas</button>
      <input id="filterProgramName" placeholder="Filtrar por nombre (opcional)" />
    </div>
    <div id="listProgramsResult" class="result">Presiona "Cargar Programas" para ver los programas.</div>
  </div>

  <!-- OBTENER PROGRAMA POR ID -->
  <div class="card">
    <h2>Obtener Programa por ID</h2>
    <input id="getProgramId" placeholder="ID del programa" />
    <button onclick="getProgramById()">Buscar</button>
    <div id="getProgramResult" class="result"></div>
  </div>

  <!-- ACTUALIZAR PROGRAMA -->
  <div class="card">
    <h2>Actualizar Programa</h2>
    <input id="updProgramId" placeholder="ID del programa" />
    <input id="updProgramName" placeholder="Nuevo nombre" />
    <input id="updProgramDesc" placeholder="Nueva descripción" />
    <input id="updProgramCapacity" type="number" placeholder="Nueva capacidad" />
    <button onclick="updateProgram()">Actualizar</button>
    <div id="updateProgramResult" class="result"></div>
  </div>

  <!-- ELIMINAR PROGRAMA -->
  <div class="card">
    <h2>Eliminar Programa</h2>
    <input id="deleteProgramId" placeholder="ID del programa" />
    <button onclick="deleteProgram()">Eliminar</button>
    <div id="deleteProgramResult" class="result"></div>
  </div>

  <!-- CREAR EDUCADOR -->
  <div class="card">
    <h2>Crear Educador</h2>
    <input id="eduFirst" placeholder="Nombre" />
    <input id="eduLast" placeholder="Apellido" />
    <input id="eduEmail" placeholder="Email" />
    <input id="eduSpec" placeholder="Especialización" />
    <button onclick="createEducator()">Crear Educador</button>
    <div id="createEducatorResult" class="result"></div>
  </div>

<script>
// API ENDPOINTS
const API = {
  root: "http://localhost:3000/api",
  register: "http://localhost:3000/api/auth/register",
  login: "http://localhost:3000/api/auth/login",
  logout: "http://localhost:3000/api/auth/logout",
  updateUser: id => `http://localhost:3000/api/users/${id}`,
  createProgram: "http://localhost:3000/api/programs",
  listPrograms: "http://localhost:3000/api/programs",
  getProgram: id => `http://localhost:3000/api/programs/${id}`,
  updateProgram: id => `http://localhost:3000/api/programs/${id}`,
  deleteProgram: id => `http://localhost:3000/api/programs/${id}`,
  createEducator: "http://localhost:3000/api/admin/educators"
};

let token = null;

function showResult(elId, data) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
}

async function safeFetch(url, opts = {}) {
  try {
    const res = await fetch(url, opts);
    const contentType = res.headers.get('content-type') || '';
    let body = null;
    if (contentType.includes('application/json')) body = await res.json();
    else body = await res.text();
    if (!res.ok) throw { status: res.status, body };
    return body;
  } catch (err) {
    throw err;
  }
}

// LOGIN
async function login() {
  try {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const data = await safeFetch(API.login, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    if (data.access_token) {
      token = data.access_token;
      localStorage.setItem('lt_token', token);
    }
    showResult('loginResult', data);
  } catch (err) {
    showResult('loginResult', err.body || (err.message || String(err)));
  }
}

// LOGOUT
function logout() {
  token = null;
  localStorage.removeItem('lt_token');
  showResult('loginResult', 'Sesión cerrada.');
}

// REGISTER
async function registerUser() {
  try {
    const body = {
      first_name: document.getElementById("regFirst").value,
      last_name: document.getElementById("regLast").value,
      email: document.getElementById("regEmail").value,
      password: document.getElementById("regPass").value
    };
    const data = await safeFetch(API.register, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    showResult('registerResult', data);
  } catch (err) {
    showResult('registerResult', err.body || (err.message || String(err)));
  }
}

// UPDATE USER
async function updateUser() {
  if (!token) return alert("Primero inicia sesión");
  try {
    const id = document.getElementById("updUserId").value;
    const body = {
      first_name: document.getElementById("updUserFirst").value,
      last_name: document.getElementById("updUserLast").value
    };
    const data = await safeFetch(API.updateUser(id), {
      method: "PATCH",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify(body)
    });
    showResult('updateUserResult', data);
  } catch (err) {
    showResult('updateUserResult', err.body || (err.message || String(err)));
  }
}

// CREATE PROGRAM
async function createProgram() {
  if (!token) return alert("Primero inicia sesión");
  try {
    const body = {
      name: document.getElementById("programName").value,
      description: document.getElementById("programDesc").value,
      capacity: Number(document.getElementById("programCapacity").value)
    };
    const data = await safeFetch(API.createProgram, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify(body)
    });
    showResult('createProgramResult', data);
  } catch (err) {
    showResult('createProgramResult', err.body || (err.message || String(err)));
  }
}

// LIST PROGRAMS
async function listPrograms() {
  try {
    const res = await fetch(API.listPrograms);
    if (!res.ok) throw { status: res.status, body: await res.text() };
    const programs = await res.json();
    const filter = document.getElementById('filterProgramName').value.toLowerCase();
    const filtered = !filter ? programs : programs.filter(p => (p.name||'').toLowerCase().includes(filter));
    showResult('listProgramsResult', filtered);
  } catch (err) {
    showResult('listProgramsResult', err.body || (err.message || String(err)));
  }
}

// GET PROGRAM BY ID
async function getProgramById() {
  try {
    const id = document.getElementById("getProgramId").value;
    const data = await safeFetch(API.getProgram(id));
    showResult('getProgramResult', data);
  } catch (err) {
    showResult('getProgramResult', err.body || (err.message || String(err)));
  }
}

// UPDATE PROGRAM
async function updateProgram() {
  if (!token) return alert("Primero inicia sesión");
  try {
    const id = document.getElementById("updProgramId").value;
    const body = {
      name: document.getElementById("updProgramName").value || undefined,
      description: document.getElementById("updProgramDesc").value || undefined,
      capacity: document.getElementById("updProgramCapacity").value ? Number(document.getElementById("updProgramCapacity").value) : undefined
    };
    const data = await safeFetch(API.updateProgram(id), {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify(body)
    });
    showResult('updateProgramResult', data);
  } catch (err) {
    showResult('updateProgramResult', err.body || (err.message || String(err)));
  }
}

// DELETE PROGRAM
async function deleteProgram() {
  if (!token) return alert("Primero inicia sesión");
  try {
    const id = document.getElementById("deleteProgramId").value;
    const data = await safeFetch(API.deleteProgram(id), {
      method: "DELETE",
      headers: { Authorization: `Bearer ${token}` }
    });
    showResult('deleteProgramResult', data);
  } catch (err) {
    showResult('deleteProgramResult', err.body || (err.message || String(err)));
  }
}

// CREATE EDUCATOR
async function createEducator() {
  if (!token) return alert("Primero inicia sesión");
  try {
    const body = {
      first_name: document.getElementById("eduFirst").value,
      last_name: document.getElementById("eduLast").value,
      email: document.getElementById("eduEmail").value,
      specialization: document.getElementById("eduSpec").value,
      password: "12345678"
    };
    const data = await safeFetch(API.createEducator, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify(body)
    });
    showResult('createEducatorResult', data);
  } catch (err) {
    showResult('createEducatorResult', err.body || (err.message || String(err)));
  }
}

// Init: load token from localStorage if exists
(function init() {
  const saved = localStorage.getItem('lt_token');
  if (saved) token = saved;
})();
</script>

</body>
</html>
